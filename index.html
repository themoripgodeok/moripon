<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>몰입온 관리형 스터디카페</title>
  <meta name="description" content="몰입온 관리형 스터디카페 일정 신청 페이지">
  <style>
    :root {
      --bg: #101010;
      --panel: #191919;
      --panel-hover: #202020;
      --gold: #c6a66b;
      --gold-light: #e0c58f;
      --text: #f4f1eb;
      --muted: #aaa49a;
      --line: rgba(198,166,107,.24);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(198,166,107,.10), transparent 42%),
        linear-gradient(180deg, #151515 0%, var(--bg) 68%);
      font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.025em;
    }
    .page {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding: 76px 0 42px;
    }
    header { text-align: center; margin-bottom: 52px; }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 40px;
      margin-bottom: 28px;
      color: var(--gold-light);
    }
    .brand-mark svg { display: block; width: 62px; height: 40px; }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .28em;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 5vw, 39px);
      font-weight: 650;
      letter-spacing: -.055em;
    }
    .subtitle {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -.02em;
    }
    .rule {
      width: 42px;
      height: 1px;
      margin: 30px auto 0;
      background: var(--gold);
      opacity: .75;
    }
    .section-label {
      margin: 0 0 17px 2px;
      color: #8e887e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2em;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .menu-card {
      position: relative;
      display: flex;
      min-height: 190px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 25px 23px 22px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: linear-gradient(145deg, #202020, #171717);
      border: 1px solid var(--line);
      border-radius: 3px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .menu-card::after {
      position: absolute;
      right: -28px;
      bottom: -42px;
      width: 112px;
      height: 112px;
      border: 1px solid rgba(198,166,107,.10);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    .menu-card:hover {
      transform: translateY(-3px);
      border-color: rgba(224,197,143,.7);
      background: linear-gradient(145deg, #25231f, #191919);
    }
    .card-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .card-number {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: .08em;
    }
    .card-icon { width: 25px; height: 25px; color: var(--gold-light); opacity: .9; }
    .card-title { margin: 28px 0 0; font-size: 21px; font-weight: 600; letter-spacing: -.045em; }
    .card-bottom {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      color: #aaa49a;
      font-size: 12px;
    }
    .arrow { color: var(--gold); font-size: 18px; line-height: 1; transition: transform .2s ease; }
    .menu-card:hover .arrow { transform: translateX(4px); }
    footer {
      margin-top: 65px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #77736d;
      text-align: center;
      font-size: 11px;
      letter-spacing: .04em;
    }
    @media (max-width: 650px) {
      .page { width: min(100% - 34px, 430px); padding: 55px 0 30px; }
      header { margin-bottom: 39px; }
      .menu { grid-template-columns: 1fr; gap: 11px; }
      .menu-card { min-height: 125px; padding: 19px 20px 17px; }
      .card-title { margin-top: 12px; font-size: 19px; }
      .card-bottom { margin-top: 12px; }
      footer { margin-top: 45px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 62 40" role="img" aria-label="MORIPON 심볼">
          <path d="M4 32 A27 27 0 0 1 58 32 M4 32 H58 M31 7 V32" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="eyebrow">MORIPON STUDY CAFE</p>
      <h1>몰입온 관리형 스터디카페</h1>
      <p class="subtitle">체계적인 학습 관리를 위한 일정 신청</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section aria-label="일정 신청 메뉴">
      <p class="section-label">SCHEDULE APPLICATION</p>
      <nav class="menu">
        <a class="menu-card" href="regular-schedule.html" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="card-number">01</span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15.5" rx="1.5"></rect><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2M14 13h2M8 16.5h2"></path>
            </svg>
          </div>
          <h2 class="card-title">정기일정</h2>
          <div class="card-bottom"><span>정기 일정 신청하기</span><span class="arrow" aria-hidden="true">→</span></div>
        </a>

        <a class="menu-card" href="reason-schedule.html" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="card-number">02</span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.5 20 7v5.2c0 4.4-3.1 7.1-8 8.8-4.9-1.7-8-4.4-8-8.8V7l8-3.5Z"></path><path d="m8.5 12 2.2 2.2 4.8-4.8"></path>
            </svg>
          </div>
          <h2 class="card-title">사유일정</h2>
          <div class="card-bottom"><span>사유 일정 신청하기</span><span class="arrow" aria-hidden="true">→</span></div>
        </a>

        <a class="menu-card" href="https://forms.gle/QLbtCz4MUuFxWfTb7" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="card-number">03</span>
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5V5.8a1.8 1.8 0 0 1 1.8-1.8H20v15.5H5.8A1.8 1.8 0 0 0 4 21.3"></path><path d="M4 16.5c.5-.7 1.1-1 1.8-1H20M8 8h8M8 11.5h5"></path>
            </svg>
          </div>
          <h2 class="card-title">모의고사</h2>
          <div class="card-bottom"><span>모의고사 신청하기</span><span class="arrow" aria-hidden="true">→</span></div>
        </a>
      </nav>
    </section>

    <footer>© MORIPON STUDY CAFE. ALL RIGHTS RESERVED.</footer>
  </main>
</body>
</html>
